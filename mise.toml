[tools]
python = "{{ get_env(name='PYTHON_VERSION', default='3.14') }}"
uv = "0.11.19"

[env]
PROJECT_NAME = "{{ config_root | basename }}"
_.python.venv = { path = ".venv", create = true }

[tools."pipx:properdocs"]
  version="latest"
  uvx_args='''
  --with mkdocs-material
  --with mkdocs-rss-plugin
  --with mkdocs-mermaid2-plugin
  --with mkdocs-panzoom-plugin
  --with mkdocs-d2-plugin
  --with mkdocs-macros-plugin
  --with markdown-exec
  --with mkdocs-pygments
  --with mkdocs-redirects
  --with mkdocs-autolinks-plugin
  --with mkdocs-awesome-pages-plugin
  '''

[tasks.docs]
  description = "Build documentation"
  run = "properdocs serve"

[tasks."docs:deploy"]
  description = "Deploy documentation to GitHub Pages"
  run = "properdocs gh-deploy --force --config-file properdocs.yaml"

site_name: Blog
repo_url: https://github.com/sbordeyne/sbordeyne.github.io
docs_dir: website

theme:
  name: material
  palette:
    - scheme: default
      primary: white
      accent: indigo
      media: "(prefers-color-scheme: light)"
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      media: "(prefers-color-scheme: dark)"
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search
  - blog:
      blog_dir: .
      post_date_format: long
      post_url_format: "{date}/{slug}"
      pagination_per_page: 10
      archive: true
      categories: true
      categories_name: Categories
  - tags  # also built-in to Material
  - rss:  # mkdocs-rss-plugin
      match_path: posts/.*
      date_from_meta:
        as_creation: date
  - awesome-pages:
      strict: false
  - mermaid2
  - macros:
      j2_block_start_string: '[[%'
      j2_block_end_string: '%]]'
      j2_variable_start_string: '[['
      j2_variable_end_string: ']]'
      j2_comment_start_string: '[#'
      j2_comment_end_string: '#]'
  - redirects:
      redirect_maps: {}
  - autolinks

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true

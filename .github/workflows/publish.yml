name: Publish Blog

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Deploy docs
        run: |
          uvx \
            --with mkdocs-material \
            --with mkdocs-rss-plugin \
            --with mkdocs-mermaid2-plugin \
            --with mkdocs-panzoom-plugin \
            --with mkdocs-d2-plugin \
            --with mkdocs-macros-plugin \
            --with markdown-exec \
            --with mkdocs-pygments \
            --with mkdocs-redirects \
            --with mkdocs-autolinks-plugin \
            --with mkdocs-awesome-pages-plugin \
            properdocs gh-deploy --force --config-file properdocs.yaml
